<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>避障小游戏 · 简易版</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e5e7eb; }
    .wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #1f2937; }
    .title { font-weight: 600; letter-spacing: .5px; }
    .hud { display: flex; gap: 12px; font-size: 14px; color: #9ca3af; }
    .canvas-box { position: relative; }
    canvas { width: 100%; height: 480px; display: block; background: linear-gradient(180deg, #0b1220, #0f172a 40%, #0b1220); }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .msg { text-align: center; }
    .msg h2 { margin: 0 0 6px; font-size: 22px; }
    .msg p { margin: 0; color: #9ca3af; }
    .btns { display: flex; gap: 10px; margin-top: 12px; justify-content: center; }
    button { pointer-events: auto; background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
    button.secondary { background: #334155; }
    .footer { padding: 12px 16px; border-top: 1px solid #1f2937; color: #94a3b8; font-size: 13px; }
    a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="title">避障小游戏 · 简易版</div>
        <div class="hud">
          <div>分数：<span id="score">0</span></div>
          <div>最佳：<span id="best">0</span></div>
        </div>
      </div>
      <div class="canvas-box">
        <canvas id="game" width="800" height="480" aria-label="Game canvas"></canvas>
        <div class="overlay" id="overlay">
          <div class="msg">
            <h2 id="state">按空格开始</h2>
            <p>操作：← → 移动；空格开始/重开</p>
            <div class="btns">
              <button id="startBtn">开始游戏</button>
              <button id="hardBtn" class="secondary">切换难度</button>
            </div>
          </div>
        </div>
      </div>
      <div class="footer">
        小技巧：保持横移、观察落点；得分随时间与躲避计数增长。
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const hardBtn = document.getElementById('hardBtn');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const stateEl = document.getElementById('state');

    // DPR 适配
    function fitCanvas() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const cssW = canvas.clientWidth;
      const cssH = canvas.clientHeight;
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', fitCanvas);
    fitCanvas();

    let running = false;
    let gameOver = false;
    let last = 0;
    let elapsed = 0;
    let score = 0;
    let best = Number(localStorage.getItem('mini_dodge_best') || 0);
    bestEl.textContent = best;

    const player = { x: 380, y: 400, w: 40, h: 40, speed: 260 };
    const keys = new Set();
    const obstacles = [];

    let spawnInterval = 0.9; // 秒
    let spawnTimer = 0;
    let difficulty = 0; // 0 简单，1 困难

    function reset() {
      running = false;
      gameOver = false;
      score = 0;
      elapsed = 0;
      player.x = (canvas.width / (window.devicePixelRatio || 1)) / 2 - player.w / 2;
      player.y = (canvas.height / (window.devicePixelRatio || 1)) - 80;
      obstacles.length = 0;
      spawnTimer = 0;
      spawnInterval = difficulty ? 0.55 : 0.9;
      stateEl.textContent = '按空格开始';
      overlay.style.display = 'grid';
      updateHUD();
    }

    function updateHUD() { scoreEl.textContent = Math.floor(score); }

    function spawn() {
      const w = 26 + Math.random() * 50;
      const x = Math.random() * ((canvas.clientWidth - w));
      const speed = (difficulty ? 180 : 140) + Math.random() * (difficulty ? 160 : 120);
      obstacles.push({ x, y: -60, w, h: 18 + Math.random() * 20, speed });
    }

    function collide(a, b) {
      return !(a.x + a.w < b.x || a.x > b.x + b.w || a.y + a.h < b.y || a.y > b.y + b.h);
    }

    function step(ts) {
      const now = ts / 1000;
      const dt = last ? now - last : 0;
      last = now;
      if (running) {
        // 玩家移动
        if (keys.has('ArrowLeft')) player.x -= player.speed * dt;
        if (keys.has('ArrowRight')) player.x += player.speed * dt;
        player.x = Math.max(8, Math.min(canvas.clientWidth - player.w - 8, player.x));

        // 生成与下落
        spawnTimer += dt;
        const ramp = Math.min(0.6, elapsed / 25); // 难度缓慢提升
        const interval = spawnInterval - ramp * 0.35;
        if (spawnTimer >= interval) { spawn(); spawnTimer = 0; }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.y += o.speed * dt;
          if (o.y > canvas.clientHeight + 40) {
            obstacles.splice(i, 1);
            score += 5; // 躲过加分
          }
        }

        // 碰撞检测
        for (const o of obstacles) {
          if (collide(player, o)) {
            running = false; gameOver = true; overlay.style.display = 'grid';
            stateEl.textContent = '游戏结束 · 空格重开';
            best = Math.max(best, Math.floor(score));
            localStorage.setItem('mini_dodge_best', String(best));
            bestEl.textContent = best;
          }
        }

        // 计分
        elapsed += dt;
        score += dt * 2;
        updateHUD();
      }

      // 绘制
      draw();
      requestAnimationFrame(step);
    }

    function draw() {
      // 背景网格
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.clientWidth; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.clientHeight); ctx.stroke(); }
      for (let y = 0; y < canvas.clientHeight; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.clientWidth, y); ctx.stroke(); }

      // 玩家
      ctx.fillStyle = '#10b981';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // 障碍
      ctx.fillStyle = '#ef4444';
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }

      // 顶部渐隐
      const g = ctx.createLinearGradient(0, 0, 0, 120);
      g.addColorStop(0, 'rgba(15,23,42,.9)');
      g.addColorStop(1, 'rgba(15,23,42,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.clientWidth, 120);
    }

    // 事件
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        if (gameOver || !running) { overlay.style.display = 'none'; running = true; gameOver = false; last = 0; }
      }
      if (['ArrowLeft','ArrowRight'].includes(e.key)) keys.add(e.key);
    });
    window.addEventListener('keyup', e => keys.delete(e.key));

    startBtn.addEventListener('click', () => { overlay.style.display = 'none'; running = true; gameOver = false; last = 0; });
    hardBtn.addEventListener('click', () => {
      difficulty = difficulty ? 0 : 1;
      hardBtn.textContent = difficulty ? '难度：困难' : '难度：简单';
      reset();
    });

    // 初始化
    reset();
    requestAnimationFrame(step);
  </script>
</body>
</html>
